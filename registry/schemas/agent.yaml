# Agent Record Schema
# Stores capabilities and constraints of automated actors.
# Cannot proceed without: Mandate, authority bounds, escalation conditions, audit path.

$schema: "http://json-schema.org/draft-07/schema#"
title: ARCF-Agent
id: "https://alexandria.os/schemas/agent"

type: object
required:
  - id
  - kind
  - name
  - mandate
  - non_goals
  - authority
  - escalation_conditions
  - audit

properties:
  id:
    type: string
    pattern: "^AGT-[A-Z]+-[0-9]+$"

  kind:
    const: "agent"

  name:
    type: string

  mandate:
    type: string
    description: "What this agent is explicitly for"

  non_goals:
    type: array
    minItems: 1
    items: { type: string }
    description: "What this agent must NOT do"

  authority:
    type: object
    properties:
      may_search: { type: boolean }
      may_summarize: { type: boolean }
      may_create_claim_drafts: { type: boolean }
      may_publish_claims: { type: boolean }
      may_execute_external_actions: { type: boolean }
      may_access_sensitive_data: { type: boolean }
      may_modify_production: { type: boolean }
      max_automation_tier: { enum: [T0, T1, T2, T3, T4] }

  allowed_tools:
    type: array
    items: { type: string }

  prohibited_actions:
    type: array
    items: { type: string }

  data_sources:
    type: array
    items:
      type: object
      properties:
        source: { type: string }
        provenance: { type: string }
        trust_level: { enum: [verified, community, unverified] }

  uncertainty_policy:
    type: string
    description: "How the agent must express uncertainty"

  escalation_conditions:
    type: array
    minItems: 1
    items: { type: string }
    description: "When must the agent stop and escalate to human"

  required_outputs:
    type: array
    items: { type: string }
    description: "What every agent output must include"

  independent_oracles:
    type: array
    items:
      type: object
      properties:
        oracle: { type: string }
        check_frequency: { type: string }

  audit:
    type: object
    properties:
      immutable_trace: { type: boolean }
      independent_review_required: { type: boolean }
      log_retention_days: { type: integer }
      evaluation_suite: { type: string }
      reward_hacking_tests: { type: array, items: { type: string } }

  reversibility:
    type: object
    properties:
      has_kill_switch: { type: boolean }
      rollback_procedure: { type: string }
      max_irreversible_actions_per_session: { type: integer }

  status_vector:
    type: object
    properties:
      semantic: { type: integer, minimum: 0, maximum: 5 }
      implementation: { type: integer, minimum: 0, maximum: 5 }
      operational: { type: integer, minimum: 0, maximum: 5 }
