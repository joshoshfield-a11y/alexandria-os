# Decision Record Schema
# Stores consequential actions taken from evidence or model output.
# Cannot proceed without: Inputs, uncertainty, alternatives, owner, reversibility, outcome review.

$schema: "http://json-schema.org/draft-07/schema#"
title: ARCF-Decision
id: "https://alexandria.os/schemas/decision"

type: object
required:
  - id
  - kind
  - title
  - tier
  - inputs
  - uncertainty
  - alternatives
  - owner
  - reversibility
  - outcome_review

properties:
  id:
    type: string
    pattern: "^DEC-[0-9]{4}-[0-9]+$"

  kind:
    const: "decision"

  title:
    type: string

  tier:
    enum: [T0, T1, T2, T3, T4]
    description: "Consequence level of this decision"

  inputs:
    type: array
    items:
      type: object
      properties:
        claim_id: { type: string }
        confidence: { type: number, minimum: 0, maximum: 1 }
        role: { enum: [primary, supporting, contested] }

  uncertainty:
    type: object
    properties:
      known_unknowns: { type: array, items: { type: string } }
      confidence_estimate: { type: number, minimum: 0, maximum: 1 }
      sensitivity_analysis: { type: string }

  alternatives:
    type: array
    minItems: 1
    items:
      type: object
      properties:
        description: { type: string }
        why_rejected: { type: string }

  owner:
    type: string
    description: "Human accountable for this decision"

  reversibility:
    type: object
    properties:
      is_reversible: { type: boolean }
      rollback_plan: { type: string }
      time_to_rollback: { type: string }
      kill_switch_available: { type: boolean }

  commons_impact:
    type: object
    properties:
      affected_resources: { type: array, items: { type: string } }
      regeneration_plan: { type: string }
      free_rider_risk: { type: string }

  incentive_trace:
    type: object
    properties:
      who_gains_compliance: { type: string }
      who_gains_superficial_compliance: { type: string }
      likely_adaptation: { type: string }
      second_order_effects: { type: string }

  pre_mortem:
    type: object
    properties:
      intended_outcome: { type: string }
      primary_metric: { type: string }
      counter_metric: { type: string }
      likely_gaming: { type: string }
      hidden_cost: { type: string }
      excluded_population: { type: string }
      dissenting_case: { type: string }

  outcome_review:
    type: object
    required: [scheduled_date, method]
    properties:
      scheduled_date: { type: string, format: date }
      method: { type: string }
      real_outcome_metric: { type: string }
      comparison_group: { type: string }
      delayed_effects_check: { type: string }

  status:
    enum: [proposed, approved, implemented, under_review, rolled_back, retired]
